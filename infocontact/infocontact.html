<!DOCTYPE html>
<html>



<head>
    <link rel="stylesheet" href="infocontact.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>


<body>




    <section class="contact-page" id="contact">

        <div class="contact-container">

            <div class="contact-left">
                <h1>Contact Us</h1>
                <p>
                    We help businesses grow online with modern digital solutions.
                    Fill out the form and our team will contact you shortly.
                </p>

                <div class="contact-info">
                    <div class="info-box">
                        <h3>Email</h3>
                        <p>info@infotechwizard.com</p>
                    </div>

                    <div class="info-box">
                        <h3>Phone</h3>
                        <p>+91 9876543210</p>
                    </div>

                    <div class="info-box">
                        <h3>Location</h3>
                        <p>Bangalore, India</p>
                    </div>
                </div>
            </div>

            <div class="contact-right">

                <form>

                    <div class="input-group">
                        <input type="text" placeholder="Full Name" required>
                        <input type="email" placeholder="Email Address" required>
                    </div>

                    <div class="input-group">
                        <input type="text" placeholder="Mobile Number" required>
                        <input type="text" placeholder="Business Name">
                    </div>

                    <div class="input-group">
                        <input type="text" placeholder="Business Website">

                        <select>
                            <option>Select Service</option>
                            <option>Web Development</option>
                            <option>UI/UX Design</option>
                            <option>SEO</option>
                            <option>Digital Marketing</option>
                        </select>
                    </div>

                    <textarea rows="6" placeholder="Write Your Message"></textarea>

                    <button type="submit">Submit Inquiry</button>

                </form>

            </div>

        </div>

    </section>



</body>

</html>
